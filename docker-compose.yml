services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  app:
    build: .
    image: abx13/multiarth:jj
    restart: unless-stopped
    ports:
      - "8050:8050"
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      UPLOAD_DIR: /data/uploads
      WORK_DIR: /data/work
    env_file:
      - .env
    volumes:
      - app-data:/data
    # Uncomment for NVIDIA GPU (Whisper CUDA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  redis-data:
  app-data:
