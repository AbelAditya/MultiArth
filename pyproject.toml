[project]
name = "multiarth"
version = "1.0.0"
description = "Multimodal linguistic analysis of speech videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Video / vision
    "mediapipe==0.10.9",
    "scenedetect>=0.6.3",
    # YOLO-Pose (Ultralytics) — multi-person pose estimation for
    # GestureWorker, replacing MediaPipe's single-person Holistic model.
    # NOTE: Ultralytics is AGPL-3.0-licensed (copyleft, with a network-use
    # clause) — a materially different license from the rest of this
    # project's permissive (Apache/MIT/BSD) dependencies. Adopted
    # deliberately, with that tradeoff understood, not by default.
    "ultralytics>=8.4.0",
    "torch>=2.0",
    "torchvision>=0.15",
    # Audio / prosody
    "praat-parselmouth>=0.4.3",
    "soundfile>=0.12.1",
    # ASR / NLP
    "faster-whisper>=1.0.1",
    "spacy>=3.7.4",
    # zh_core_web_sm's proper multi-character word segmenter — without this,
    # spaCy's Chinese tokenizer silently falls back to splitting every single
    # character into its own token, which breaks Word Sketch, Distributional
    # Thesaurus, and Concordance for any multi-character Chinese word.
    # zh_core_web_sm itself isn't a pyproject.toml dependency (installed via
    # `spacy download` in the Dockerfile instead), so this needs to be listed
    # explicitly rather than relying on it coming along transitively.
    "spacy-pkuseg>=0.0.32",
    # Orchestration / data
    "redis>=5.0.3",
    "pymongo>=4.7",
    "pyyaml>=6.0",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "scipy>=1.13.0",
    # Dashboard
    "dash>=2.16.1",
    "plotly>=5.20.0",
    "dash-bootstrap-components>=1.6.0",
    # Utilities
    "tqdm>=4.66.2",
    "loguru>=0.7.2",
    "pydantic>=2.6.4",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "gunicorn>=21.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv]
dev-dependencies = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ipykernel>=6.29.4",
    "mongomock>=4.3.0",
]

[tool.uv.sources]
# CPU-only wheels — the default PyPI Linux build pulls in the full CUDA
# toolkit unconditionally, several GB heavier than this deployment needs.
# GPU support is deliberately deferred until real Docker/deployment
# orchestration for it is done (CUDA base image, nvidia-container-toolkit,
# a properly-scoped CUDA-version index instead of this one).
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
analyze = "cli:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = [".venv", "tests"]
