[project]
name = "multiarth"
version = "alberto"
description = "Multimodal linguistic analysis of speech videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Video / vision
    "opencv-python>=4.9.0",
    "mediapipe==0.10.9",
    "scenedetect[opencv]>=0.6.3",
    # Audio / prosody
    "praat-parselmouth>=0.4.3",
    "soundfile>=0.12.1",
    # ASR / NLP
    "faster-whisper>=1.0.1",
    "spacy>=3.7.4",
    # Orchestration / data
    "redis>=5.0.3",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "scipy>=1.13.0",
    # Dashboard
    "dash>=2.16.1",
    "plotly>=5.20.0",
    "dash-bootstrap-components>=1.6.0",
    # Utilities
    "tqdm>=4.66.2",
    "loguru>=0.7.2",
    "pydantic>=2.6.4",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "gunicorn>=21.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv]
dev-dependencies = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ipykernel>=6.29.4",
]

[project.scripts]
analyze = "cli:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = [".venv", "tests"]