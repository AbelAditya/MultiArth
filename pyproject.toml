[project]
name = "multiarth"
version = "1.0.0"
description = "Multimodal linguistic analysis of speech videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Video / vision
    # MediaPipe (PoseLandmarker only) — multi-person pose landmark
    # estimation for GestureWorker. `light-gesture` branch only — the main
    # branch uses MeTRAbs instead (TensorFlow-based; see
    # wikis/Gesture-Worker.md for the full comparison and why this branch
    # exists). HandLandmarker was tried alongside it and then deliberately
    # removed again — see wikis/Gesture-Worker.md's "Hand landmarks —
    # tried, removed". Small (~5-6MB) .task model file, downloaded lazily
    # at first use (see workers/gesture_worker.py's _ensure_model) rather
    # than baked in at Docker build time the way MeTRAbs's model was.
    #
    # Runs in-process, same as prosody/verbal/camera — no subprocess
    # isolation (see wikis/Gesture-Worker.md's "Isolation was removed" for
    # the reasoning and the acknowledged risk that decision reintroduces).
    # Measured directly, MediaPipe's peak memory here (~1.9GB after real
    # use, measured before HandLandmarker's removal) is roughly the same
    # order of magnitude as MeTRAbs's own (~1.8-2.7GB), not a verified
    # reduction. Model *load* time is a real, measured win though (~4.5s
    # vs MeTRAbs's ~15-22s).
    "mediapipe>=0.10",
    "scenedetect>=0.6.3",
    # opencv-contrib-python (not plain opencv-python) — camera_worker.py
    # needs its Haar cascade data (cv2.data.haarcascades), which plain
    # opencv-python doesn't ship. Used to arrive transitively via rtmlib;
    # now that MeTRAbs (TensorFlow-based) replaced it, nothing else in the
    # dependency tree pulls this in, so it needs to be explicit. The
    # Dockerfile additionally force-reinstalls this exact version after
    # `uv sync` to deterministically win the site-packages/cv2/ file merge
    # against scenedetect's opencv-python — see the comment there.
    "opencv-contrib-python==4.13.0.92",
    # Audio / prosody
    "praat-parselmouth>=0.4.3",
    "soundfile>=0.12.1",
    # ASR / NLP
    "faster-whisper>=1.0.1",
    # SenseVoice (via funasr) handles Chinese transcription specifically —
    # meaningfully more accurate on Mandarin than Whisper in side-by-side
    # testing (fewer homophone-confusion errors) and ~5x faster on CPU.
    # English (and any other non-Chinese language) still goes through
    # faster-whisper above; see VerbalWorker._transcribe's routing.
    "funasr>=1.4.1",
    "torch>=2.0",
    "torchaudio>=2.0",
    "modelscope>=1.9",
    # HTTP client for VerbalWorker._transcribe_alt_remote — talks to
    # colab/sensevoice_server.ipynb when SENSEVOICE_REMOTE_URL is set, so
    # funasr+torch above never need to load in this process at all. Already
    # present transitively (funasr/huggingface_hub pull it in) but declared
    # explicitly now that this code imports and uses it directly.
    "requests>=2.31",
    "spacy>=3.7.4",
    # zh_core_web_sm's proper multi-character word segmenter — without this,
    # spaCy's Chinese tokenizer silently falls back to splitting every single
    # character into its own token, which breaks Word Sketch, Distributional
    # Thesaurus, and Concordance for any multi-character Chinese word.
    # zh_core_web_sm itself isn't a pyproject.toml dependency (installed via
    # `spacy download` in the Dockerfile instead), so this needs to be listed
    # explicitly rather than relying on it coming along transitively.
    "spacy-pkuseg>=0.0.32",
    # Orchestration / data
    "redis>=5.0.3",
    "pymongo>=4.7",
    "pyyaml>=6.0",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "scipy>=1.13.0",
    # Dashboard
    "dash>=2.16.1",
    "plotly>=5.20.0",
    "dash-bootstrap-components>=1.6.0",
    # Utilities
    "tqdm>=4.66.2",
    "loguru>=0.7.2",
    "pydantic>=2.6.4",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "gunicorn>=21.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv]
dev-dependencies = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ipykernel>=6.29.4",
    "mongomock>=4.3.0",
]

[tool.uv.sources]
# CPU-only wheels — the default PyPI torch build on Linux unconditionally
# pulls in the full CUDA toolkit (nvcc compiler, dev headers, triton — not
# just the runtime libraries GPU inference actually needs) regardless of
# whether a GPU is present, several GB heavier than this deployment needs.
# GPU support is left for later — it needs real Docker/deployment work
# (CUDA base image, nvidia-container-toolkit, a properly-scoped CUDA-version
# index instead of this one) that hasn't been done yet; revisit this pin
# together with that when it's actually being set up.
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
analyze = "cli:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = [".venv", "tests"]
